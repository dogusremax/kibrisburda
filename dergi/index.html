<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kıbrıs Burda · Sayı 01 · Dergi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0b0a">
<meta property="og:title" content="Kıbrıs Burda · Sayı 01">
<meta property="og:description" content="Kuzey Kıbrıs yatırım dergisi · RE/MAX Doğuş × Döveç İnşaat">
<meta property="og:image" content="https://kibrisburda.com/dergi/s/01.jpg">
<link rel="preload" as="image" href="s/01.jpg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{color:#fff;font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
  background:#1a1410;
  background-image:
    radial-gradient(ellipse 70% 60% at 50% 45%,rgba(255,226,180,.16) 0%,rgba(0,0,0,0) 60%),
    radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 40%,rgba(0,0,0,.65) 100%),
    repeating-linear-gradient(92deg,rgba(255,255,255,.018) 0 2px,rgba(0,0,0,.03) 2px 5px,rgba(255,255,255,0) 5px 11px),
    linear-gradient(180deg,#2b2019 0%,#1f1712 50%,#17110d 100%)}
.ust{height:52px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;letter-spacing:.5px;position:relative;z-index:4}
.ust b{font-size:20px;letter-spacing:-.5px}
.ust b span{color:#E9C27A}
.ust small{font-size:11px;letter-spacing:2px;color:#E9C27A;text-transform:uppercase}
#sahne{position:absolute;left:0;right:0;top:52px;bottom:64px;display:flex;align-items:center;justify-content:center;perspective:2400px}
#kayar{position:relative;transition:transform .8s cubic-bezier(.3,.7,.3,1)}
/* masaya düşen gölge */
#golge{position:absolute;left:3%;right:3%;bottom:-14px;height:30px;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(16px);z-index:0;transition:left .8s,right .8s}
/* sayfa kalınlığı (yaprak kenarları) */
.kenar{position:absolute;top:2px;bottom:2px;z-index:0;transition:width .5s;border-radius:1px;
  background:repeating-linear-gradient(90deg,#f4efe6 0 1px,#cfc6b6 1px 2px)}
.kenar.sol{right:100%;margin-right:-1px;box-shadow:-2px 2px 4px rgba(0,0,0,.4)}
.kenar.sag{left:100%;margin-left:-1px;box-shadow:2px 2px 4px rgba(0,0,0,.4)}
#kitap{position:relative;z-index:1}
#kitap .sayfa{background:#f7f3ea;overflow:hidden}
#kitap .sayfa img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
/* kağıt dokusu + parlaklık */
#kitap .sayfa:before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.22;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .45  0 0 0 .55 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
/* cilt (orta) gölgesi */
#kitap .sayfa:after{content:"";position:absolute;top:0;bottom:0;width:16%;z-index:3;pointer-events:none}
#kitap .sayfa.--left:after{right:0;background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.05) 45%,rgba(0,0,0,.18) 80%,rgba(0,0,0,.38) 100%)}
#kitap .sayfa.--right:after{left:0;background:linear-gradient(270deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.05) 45%,rgba(0,0,0,.18) 80%,rgba(0,0,0,.38) 100%)}
#kitap .sayfa.--left .isik{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,0) 30%)}
#kitap .sayfa.--right .isik{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(270deg,rgba(255,255,255,.08),rgba(255,255,255,0) 30%)}
/* kapaklar: cilt kenarı */
#kitap .sayfa.kapak:after{width:5%;background:linear-gradient(270deg,rgba(0,0,0,0),rgba(0,0,0,.35) 70%,rgba(255,255,255,.12) 85%,rgba(0,0,0,.4))}
#kitap .sayfa.kapak.--left:after{background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.35) 70%,rgba(255,255,255,.12) 85%,rgba(0,0,0,.4))}
#kitap .sayfa.kapak:before{opacity:.08}
.alt{position:absolute;left:0;right:0;bottom:0;height:64px;padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:center;gap:18px;z-index:4}
.alt button{width:46px;height:46px;border-radius:50%;border:2px solid rgba(233,194,122,.7);background:rgba(0,0,0,.25);color:#E9C27A;font:700 24px/1 Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
.alt button:disabled{opacity:.3;cursor:default}
.alt button:not(:disabled):hover{background:#E9C27A;color:#1a1410}
#ses{position:absolute;right:14px;top:9px;width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(233,194,122,.6);background:rgba(0,0,0,.25);color:#E9C27A;cursor:pointer;z-index:5;display:flex;align-items:center;justify-content:center}
#ses svg{width:18px;height:18px}
#ses.kapali .dalga{display:none}#ses:not(.kapali) .carpi{display:none}
@media (max-width:520px){.ust{justify-content:flex-start;padding-left:16px}.ust small{display:none}}
#sayac{min-width:92px;text-align:center;font-size:15px;letter-spacing:.5px}
#ipucu{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(20,15,12,.88);border:1px solid rgba(233,194,122,.5);color:#fff;font-size:13px;padding:8px 14px;border-radius:20px;white-space:nowrap;pointer-events:none;transition:opacity .6s;z-index:5}
#yukleniyor{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:2px;color:#E9C27A;text-transform:uppercase}
</style>
</head>
<body>
<div class="ust"><b>KIBRIS<span>BURDA</span>.com</b><small>Sayı 01 · Kasım 2026</small></div>
<button id="ses" aria-label="Sesi aç/kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><g class="dalga"><path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a7.5 7.5 0 0 1 0 11"/></g><g class="carpi"><path d="M17 9l5 6M22 9l-5 6"/></g></svg></button>
<div id="sahne"><div id="yukleniyor">Dergi açılıyor…</div><div id="kayar"></div></div>
<div id="ipucu">Sayfayı çevirmek için dokunun ya da kaydırın</div>
<div class="alt">
  <button id="geri" aria-label="Önceki sayfa">‹</button>
  <div id="sayac">1 / 16</div>
  <button id="ileri" aria-label="Sonraki sayfa">›</button>
</div>
<script src="page-flip.js"></script>
<script>
(function(){
  var N=16, ORAN=1980/1400, pf=null, simdiki=0;
  var sahne=document.getElementById('sahne'), kayar=document.getElementById('kayar');
  var sayac=document.getElementById('sayac'), geri=document.getElementById('geri'), ileri=document.getElementById('ileri');

  /* ---- ses ---- */
  var AC=window.AudioContext||window.webkitAudioContext, ctx=null, tampon={}, sesAcik=true;
  try{sesAcik=localStorage.getItem('dergiSes')!=='0';}catch(e){}
  var sesBtn=document.getElementById('ses'); if(!sesAcik) sesBtn.classList.add('kapali');
  var DOSYA=['bookFlip1','bookFlip2','bookFlip3','bookOpen','bookClose'];
  var ham={};
  DOSYA.forEach(function(ad){fetch('ses/'+ad+'.mp3').then(function(r){return r.arrayBuffer();}).then(function(b){ham[ad]=b; if(ctx) coz(ad);}).catch(function(){});});
  function coz(ad){ if(!ham[ad]||tampon[ad]) return; var b=ham[ad]; ham[ad]=null; ctx.decodeAudioData(b,function(t){tampon[ad]=t;},function(){}); }
  function sesHazirla(){
    if(ctx||!AC) return; ctx=new AC();
    DOSYA.forEach(coz);
  }
  function kilitAc(){sesHazirla(); if(ctx&&ctx.state==='suspended') ctx.resume();}
  ['pointerdown','touchstart','keydown','mousedown'].forEach(function(ev){document.addEventListener(ev,kilitAc,{passive:true,capture:true});});
  function cal(ad,ses){
    if(!sesAcik||!ctx||!tampon[ad]) return;
    var s=ctx.createBufferSource(); s.buffer=tampon[ad]; s.playbackRate.value=0.92+Math.random()*0.16;
    var g=ctx.createGain(); g.gain.value=ses||0.9; s.connect(g); g.connect(ctx.destination); s.start();
  }
  var sonSes=0;
  function cevirmeSesi(hedef){
    var t=Date.now(); if(t-sonSes<250) return; sonSes=t;
    if(hedef===0||hedef>=N-1&&!tek) cal('bookClose',0.8);
    else if(simdiki===0&&!tek) cal('bookOpen',0.9);
    else cal(['bookFlip1','bookFlip2','bookFlip3'][Math.floor(Math.random()*3)],1);
  }
  sesBtn.onclick=function(){sesAcik=!sesAcik; sesBtn.classList.toggle('kapali',!sesAcik);
    try{localStorage.setItem('dergiSes',sesAcik?'1':'0');}catch(e){}
    if(sesAcik){kilitAc(); setTimeout(function(){cal('bookFlip3',.7);},60);} };

  function sayfaHTML(){
    var h='';
    for(var i=1;i<=N;i++){var n=(i<10?'0':'')+i, kap=(i==1||i==N);
      h+='<div class="sayfa'+(kap?' kapak':'')+'"'+(kap?' data-density="hard"':'')+'><img src="s/'+n+'.jpg" alt="Sayfa '+i+'" '+(i>4?'loading="lazy"':'')+'><div class="isik"></div></div>';}
    return h;
  }
  function olc(){
    var W=sahne.clientWidth-40, H=sahne.clientHeight-30;
    var cift=W>=760 && W/H>0.95;
    var pw=cift?Math.min(W/2,H/ORAN):Math.min(W,H/ORAN);
    pw=Math.floor(pw);
    return {cift:cift,pw:pw,ph:Math.floor(pw*ORAN)};
  }
  var tek=false, pw=0, solK, sagK, golge;
  function kenarlar(){
    var MAX=tek?5:9, okunan=simdiki/(N-1);
    var sol=Math.round(MAX*okunan), sag=Math.round(MAX*(1-okunan));
    if(!tek){ if(simdiki===0) sol=0; if(simdiki>=N-1) sag=0; }
    else { sol=0; }
    solK.style.width=sol+'px'; sagK.style.width=sag+'px';
    // kapalıyken kenarlar kitabın tek yarısında
    if(!tek){
      if(simdiki===0){ solK.style.right=''; sagK.style.left=''; solK.style.display='none'; sagK.style.display='block'; golge.style.left='52%'; golge.style.right='2%'; }
      else if(simdiki>=N-1){ solK.style.display='block'; sagK.style.display='none'; golge.style.left='2%'; golge.style.right='52%'; }
      else { solK.style.display='block'; sagK.style.display='block'; golge.style.left='2%'; golge.style.right='2%'; }
    }
  }
  function kaydir(){
    if(tek){kayar.style.transform='none';return;}
    var t=0;
    if(simdiki===0) t=-pw/2; else if(simdiki>=N-1) t=pw/2;
    kayar.style.transform='translateX('+t+'px)';
  }
  function guncelle(){
    var goster;
    if(tek) goster=(simdiki+1)+' / '+N;
    else if(simdiki===0) goster='Kapak';
    else if(simdiki>=N-1) goster='Arka kapak';
    else {var a=simdiki%2?simdiki:simdiki-1; goster=(a+1)+'–'+(a+2)+' / '+N;}
    sayac.textContent=goster;
    geri.disabled=simdiki===0; ileri.disabled=simdiki>=N-1;
    kaydir(); kenarlar();
  }
  function kur(){
    var o=olc(); tek=!o.cift; pw=o.pw;
    var eski=simdiki;
    if(pf){try{pf.destroy();}catch(e){}}
    kayar.innerHTML='<div id="golge"></div><div class="kenar sol"></div><div class="kenar sag"></div><div id="kitap"></div>';
    solK=kayar.querySelector('.kenar.sol'); sagK=kayar.querySelector('.kenar.sag'); golge=document.getElementById('golge');
    var kitap=document.getElementById('kitap');
    var genis=(tek?o.pw:o.pw*2);
    kayar.style.width=genis+'px'; kayar.style.height=o.ph+'px';
    kitap.style.width=genis+'px';
    kitap.innerHTML=sayfaHTML();
    if(tek){ // tek sayfada kenarlar kitabın sağında
      solK.style.display='none'; golge.style.left='3%'; golge.style.right='3%';
    }
    pf=new St.PageFlip(kitap,{width:o.pw,height:o.ph,size:'fixed',showCover:true,usePortrait:tek,
      drawShadow:true,maxShadowOpacity:.75,flippingTime:1000,mobileScrollSupport:false,startPage:eski,
      swipeDistance:20,showPageCorners:true,disableFlipByClick:false});
    pf.loadFromHTML(kitap.querySelectorAll('.sayfa'));
    pf.on('changeState',function(e){ if(e.data==='flipping'||e.data==='user_fold'){ /* sürüklemede ses bırakınca */ }
      if(e.data==='flipping') cevirmeSesi(hedefTahmin); });
    pf.on('flip',function(e){simdiki=e.data;guncelle();gizleIpucu();});
    simdiki=pf.getCurrentPageIndex();
    var y=document.getElementById('yukleniyor'); if(y) y.remove();
    guncelle();
  }
  var hedefTahmin=-1;
  geri.onclick=function(){if(!pf)return; hedefTahmin=simdiki-1; pf.flipPrev();};
  ileri.onclick=function(){if(!pf)return; hedefTahmin=simdiki+1; pf.flipNext();};
  sahne.addEventListener('pointerdown',function(e){hedefTahmin=-1;},true);
  document.addEventListener('keydown',function(e){if(!pf)return;
    if(e.key==='ArrowRight'){hedefTahmin=simdiki+1;pf.flipNext();}
    if(e.key==='ArrowLeft'){hedefTahmin=simdiki-1;pf.flipPrev();}});
  var ip=document.getElementById('ipucu');
  function gizleIpucu(){ip.style.opacity=0;}
  setTimeout(gizleIpucu,6000);
  var zam=null;
  window.addEventListener('resize',function(){clearTimeout(zam);zam=setTimeout(function(){
    var o=olc(); if(o.pw!==pw||o.cift===tek) kur();},250);});
  var ilk=new Image(); ilk.onload=ilk.onerror=kur; ilk.src='s/01.jpg';
})();
</script>
</body>
</html>
