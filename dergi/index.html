<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kıbrıs Burda · Sayı 01 · Dergi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050A30">
<meta property="og:title" content="Kıbrıs Burda · Sayı 01">
<meta property="og:description" content="Kuzey Kıbrıs yatırım dergisi · RE/MAX Doğuş × Döveç İnşaat">
<meta property="og:image" content="https://kibrisburda.com/dergi/s/01.jpg">
<link rel="preload" as="image" href="s/01.jpg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(ellipse at 50% 40%,#18215A 0%,#050A30 70%);color:#fff;font-family:Arial,'Liberation Sans',Helvetica,sans-serif;font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ust{height:52px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;letter-spacing:.5px}
.ust b{font-size:20px;letter-spacing:-.5px}
.ust b span{color:#E9C27A}
.ust small{font-size:11px;letter-spacing:2px;color:#E9C27A;text-transform:uppercase}
#sahne{position:absolute;left:0;right:0;top:52px;bottom:64px;display:flex;align-items:center;justify-content:center}
#kayar{transition:transform .7s cubic-bezier(.3,.7,.3,1)}
#kitap .stf__block{filter:drop-shadow(0 18px 40px rgba(0,0,0,.5))}
#kitap .sayfa{background:#fff}
#kitap .sayfa img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
.alt{position:absolute;left:0;right:0;bottom:0;height:64px;padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:center;gap:18px}
.alt button{width:46px;height:46px;border-radius:50%;border:2px solid rgba(233,194,122,.7);background:rgba(255,255,255,.06);color:#E9C27A;font:700 24px/1 Arial,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center}
.alt button:disabled{opacity:.3;cursor:default}
.alt button:not(:disabled):hover{background:#E9C27A;color:#050A30}
#sayac{min-width:92px;text-align:center;font-size:15px;letter-spacing:.5px}
#ipucu{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:rgba(5,10,48,.85);border:1px solid rgba(233,194,122,.5);color:#fff;font-size:13px;padding:8px 14px;border-radius:20px;white-space:nowrap;pointer-events:none;transition:opacity .6s;z-index:5}
#yukleniyor{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:2px;color:#E9C27A;text-transform:uppercase}
</style>
</head>
<body>
<div class="ust"><b>KIBRIS<span>BURDA</span>.com</b><small>Sayı 01 · Kasım 2026</small></div>
<div id="sahne"><div id="yukleniyor">Dergi açılıyor…</div><div id="kayar"><div id="kitap"></div></div></div>
<div id="ipucu">Sayfayı çevirmek için dokunun ya da kaydırın</div>
<div class="alt">
  <button id="geri" aria-label="Önceki sayfa">‹</button>
  <div id="sayac">1 / 16</div>
  <button id="ileri" aria-label="Sonraki sayfa">›</button>
</div>
<script src="page-flip.js"></script>
<script>
(function(){
  var N=16, ORAN=1980/1400, pf=null, simdiki=0;
  var sahne=document.getElementById('sahne'), kayar=document.getElementById('kayar');
  var sayac=document.getElementById('sayac'), geri=document.getElementById('geri'), ileri=document.getElementById('ileri');
  function sayfaHTML(){
    var h='';
    for(var i=1;i<=N;i++){var n=(i<10?'0':'')+i;
      h+='<div class="sayfa"'+(i==1||i==N?' data-density="hard"':'')+'><img src="s/'+n+'.jpg" alt="Sayfa '+i+'" '+(i>4?'loading="lazy"':'')+'></div>';}
    return h;
  }
  function olc(){
    var W=sahne.clientWidth-24, H=sahne.clientHeight-16;
    var cift=W>=760 && W/H>0.95;
    var pw=cift?Math.min(W/2,H/ORAN):Math.min(W,H/ORAN);
    pw=Math.floor(pw);
    return {cift:cift,pw:pw,ph:Math.floor(pw*ORAN)};
  }
  var tek=false, pw=0;
  function kaydir(){
    if(tek){kayar.style.transform='none';return;}
    var t=0;
    if(simdiki===0) t=-pw/2; else if(simdiki>=N-1) t=pw/2;
    kayar.style.transform='translateX('+t+'px)';
  }
  function guncelle(){
    var goster;
    if(tek) goster=(simdiki+1)+' / '+N;
    else if(simdiki===0) goster='Kapak';
    else if(simdiki>=N-1) goster='Arka kapak';
    else {var a=simdiki%2?simdiki:simdiki-1; goster=(a+1)+'–'+(a+2)+' / '+N;}
    sayac.textContent=goster;
    geri.disabled=simdiki===0; ileri.disabled=simdiki>=N-1;
    kaydir();
  }
  function kur(){
    var o=olc(); tek=!o.cift; pw=o.pw;
    var eski=simdiki;
    if(pf){try{pf.destroy();}catch(e){}}
    kayar.innerHTML='<div id="kitap"></div>';
    var kitap=document.getElementById('kitap');
    kitap.style.width=(tek?o.pw:o.pw*2)+'px';
    kitap.innerHTML=sayfaHTML();
    pf=new St.PageFlip(kitap,{width:o.pw,height:o.ph,size:'fixed',showCover:true,usePortrait:tek,
      drawShadow:true,maxShadowOpacity:.55,flippingTime:850,mobileScrollSupport:false,startPage:eski,
      swipeDistance:20,showPageCorners:true,disableFlipByClick:false});
    pf.loadFromHTML(kitap.querySelectorAll('.sayfa'));
    pf.on('flip',function(e){simdiki=e.data;guncelle();gizleIpucu();});
    simdiki=pf.getCurrentPageIndex();
    document.getElementById('yukleniyor')&&document.getElementById('yukleniyor').remove();
    guncelle();
  }
  geri.onclick=function(){pf&&pf.flipPrev();};
  ileri.onclick=function(){pf&&pf.flipNext();};
  document.addEventListener('keydown',function(e){if(!pf)return;if(e.key==='ArrowRight')pf.flipNext();if(e.key==='ArrowLeft')pf.flipPrev();});
  var ip=document.getElementById('ipucu');
  function gizleIpucu(){ip.style.opacity=0;}
  setTimeout(gizleIpucu,6000);
  var zam=null, sonMod=null;
  window.addEventListener('resize',function(){clearTimeout(zam);zam=setTimeout(function(){
    var o=olc(); if(o.pw!==pw||o.cift===tek) kur();},250);});
  var ilk=new Image(); ilk.onload=ilk.onerror=kur; ilk.src='s/01.jpg';
})();
</script>
</body>
</html>
